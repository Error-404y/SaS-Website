<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fb">
  <meta name="robots" content="noindex, nofollow">
  <title>SaS | Under Construction</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#22283c;background:#f8f8fb}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;}body{min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;background:radial-gradient(ellipse at 50% 38%,rgba(218,197,237,.32),transparent 56%),radial-gradient(ellipse at 8% 88%,rgba(186,207,236,.26),transparent 48%),radial-gradient(ellipse at 94% 7%,rgba(243,220,178,.26),transparent 43%),#f8f8fb}
    header{display:flex;align-items:center;gap:12px;margin:25px clamp(24px,5vw,76px) 0;padding-bottom:16px;border-bottom:1px solid #e9e5ef}
    header img{width:52px;height:52px;object-fit:contain}
    .brand{display:flex;flex-direction:column;gap:3px}
    .brand strong{font-size:28px;letter-spacing:-.055em;color:#342344}
    .brand span{font-size:10px;letter-spacing:.19em;font-weight:760;color:#898093}
    main{width:100%;padding:36px 20px 54px;display:grid;place-items:center;flex:1}
    .panel{position:relative;text-align:center;width:min(100%,780px);padding:54px clamp(20px,5vw,64px) 50px;border:1px solid rgba(144,107,175,.22);border-radius:25px;background:rgba(255,255,255,.77);box-shadow:0 25px 70px rgba(59,39,74,.075);backdrop-filter:blur(12px)}
    .crest{width:clamp(145px,22vw,205px);height:auto;filter:drop-shadow(0 12px 16px rgba(68,38,84,.1))}
    .eyebrow{font-size:11px;letter-spacing:.22em;font-weight:750;color:#997c4c;margin:18px 0 13px}
    h1{font-size:clamp(37px,6.7vw,67px);letter-spacing:-.06em;line-height:1.05;color:#22233d;margin:0}
    .copy{font-size:clamp(14px,1.8vw,17px);color:#727b90;line-height:1.65;max-width:490px;margin:22px auto 28px}
    .divider{display:flex;align-items:center;justify-content:center;gap:24px;color:#9f84b6;font-size:25px}
    .divider:before,.divider:after{content:"";width:min(20vw,125px);height:1px;background:linear-gradient(90deg,transparent,#c9bbd8)}
    .divider:after{transform:rotate(180deg)}
    .status{display:flex;justify-content:center;align-items:center;gap:10px;margin:22px auto 0;color:#9e8da9;font-size:12px;letter-spacing:.04em}
    .dot{width:7px;height:7px;border-radius:50%;background:#ad86c6;box-shadow:0 0 0 5px rgba(175,134,202,.1);animation:breathe 2.8s ease-in-out infinite}
    @keyframes breathe{50%{opacity:.4;transform:scale(.75)}}footer{margin:0 clamp(24px,5vw,76px) 24px;padding-top:15px;border-top:1px solid #e9e5ef;font-size:10px;font-weight:700;letter-spacing:.17em;color:#9594a3;display:flex;justify-content:space-between;gap:10px}
    @media(max-width:520px){header{margin-top:16px}.panel{padding:36px 18px}.crest{width:145px}footer{font-size:9px;letter-spacing:.09em}}
    @media(prefers-reduced-motion:reduce){.dot{animation:none}}
  </style>
</head>
<body>
  <header aria-label="Saints and Sinners"><img src="/assets/logo.webp" alt=""><div class="brand"><strong>SaS</strong><span>SAINTS AND SINNERS</span></div></header>
  <main>
    <section class="panel" aria-labelledby="heading">
      <img class="crest" src="/assets/logo.webp" alt="Saints and Sinners crest" width="205" height="205">
      <p class="eyebrow">THE ALLIANCE WEBSITE</p>
      <h1 id="heading">Under Construction</h1>
      <p class="copy">We're currently improving the Saints and Sinners website and preparing new features. Please check back soon.</p>
      <div class="divider" aria-hidden="true">⚒</div>
      <p class="status"><span class="dot" aria-hidden="true"></span>WEBSITE MAINTENANCE IN PROGRESS</p>
    </section>
  </main>
  <footer><span>SAINTS AND SINNERS</span><span>THANK YOU FOR YOUR PATIENCE</span></footer>
</body>
</html>
